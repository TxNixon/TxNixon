<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Joe — business meets code</title>
  <desc id="desc">A calm, terminal-inspired banner for Joe, a business owner and curious builder in Surabaya. The terminal cursor and status light animate gently.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220" />
      <stop offset="1" stop-color="#12263a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#52647a" stroke-opacity=".13" />
    </pattern>
    <style>
      @keyframes cursorBlink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      @keyframes statusBreathe { 0%, 100% { opacity: .95; } 50% { opacity: .48; } }
      .cursor { animation: cursorBlink 1.1s steps(1, end) infinite; }
      .status-light { animation: statusBreathe 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .status-light { animation: none; }
        .cursor { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#background)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />
  <path d="M0 379H1200" stroke="#22d3ee" stroke-width="2" />

  <g font-family="monospace">
    <text x="52" y="62" fill="#67e8f9" font-size="15" letter-spacing="3">TXNIXON / PERSONAL WORKSPACE</text>
    <text x="52" y="133" fill="#f1f5f9" font-size="51" font-weight="700">Joe<tspan fill="#22d3ee">.</tspan></text>
    <text x="54" y="180" fill="#c0ccda" font-size="22">Business owner. Curious builder.</text>
    <text x="54" y="218" fill="#94a3b8" font-size="22">Turning repetitive work into useful software.</text>

    <rect x="54" y="270" width="316" height="38" rx="19" fill="#133541" stroke="#226073" />
    <circle class="status-light" cx="76" cy="289" r="4" fill="#34d399" />
    <text x="92" y="295" fill="#a5f3fc" font-size="14" letter-spacing=".2">SURABAYA, ID / ALWAYS LEARNING</text>

    <rect x="735" y="82" width="414" height="226" rx="12" fill="#080e1b" stroke="#294155" />
    <path d="M735 121H1149" stroke="#294155" />
    <circle cx="758" cy="102" r="5" fill="#fb7185" />
    <circle cx="776" cy="102" r="5" fill="#fbbf24" />
    <circle cx="794" cy="102" r="5" fill="#34d399" />
    <text x="1125" y="106" text-anchor="end" fill="#52647a" font-size="11" letter-spacing="1.4">BUILD MODE</text>

    <text x="758" y="156" fill="#64748b" font-size="14">~/life/build.js</text>
    <text x="758" y="194" fill="#67e8f9" font-size="17">const focus = [</text>
    <text x="780" y="225" fill="#a7f3d0" font-size="16">"business", "automation",</text>
    <text x="780" y="254" fill="#a7f3d0" font-size="16">"code that solves problems"</text>
    <text x="758" y="283" fill="#67e8f9" font-size="17">];</text>
    <rect class="cursor" x="794" y="269" width="2" height="19" rx="1" fill="#f1f5f9" />
  </g>
</svg>
