<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Bug Hunter — animated arcade scene</title><desc id="desc">Decorative looping animation of a spaceship hunting pixel bugs. This is not an interactive game or a representation of GitHub contributions.</desc><style>@keyframes patrol{0%,100%{transform:translateX(0)}50%{transform:translateX(510px)}}@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(36px)}}@keyframes shot{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%,100%{transform:translateY(-145px);opacity:0}}.ship{animation:patrol 8s ease-in-out infinite}.bugs{animation:drift 4s ease-in-out infinite}.shot{animation:shot 1.2s linear infinite}@media(prefers-reduced-motion:reduce){.ship,.bugs,.shot{animation:none}}</style>
